[package]
name = "base-benchmark-load"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "HTTP load generator for Base benchmarks"
repository = "https://github.com/base-rs/base-benchmark-load"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[dependencies]
base-benchmark = { version = "0.4.0", default-features = false }
httparse = "1.10.1"
libc = "0.2.191"
serde_json = "1.0.154"

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]
